name: Deploy page

# The scrape runs on a home machine (Cloudflare blocks GitHub's datacenter IPs).
# That machine commits the new snapshot + rebuilt site/ and pushes; this workflow
# just publishes site/ to GitHub Pages on that push.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
